services:
  - type: web
    name: gantavya-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: AUTH_SECRET
        value: gantavya-super-secure-secret-2026
      - key: DATABASE_URL
        value: sqlite:///./civicpulse.db
