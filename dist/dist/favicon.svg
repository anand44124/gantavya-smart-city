        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Glowing Target Beacon Dot -->
  <circle cx="32" cy="33.5" r="4.5" fill="url(#gantavyaInner)" filter="url(#glow)" />
  <circle cx="32" cy="33.5" r="2" fill="#ffffff" />
</svg>