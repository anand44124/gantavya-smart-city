  </defs>
  
  <!-- Outer Rounded Capsule Hexagon -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="#0f172a" stroke="url(#gantavyaGrad)" stroke-width="2.5" />
  
  <!-- Geometric 'G' Destination Loop -->
  <path d="M44 24C41.5 18 35.5 15 28 16C18.5 17.5 13 25 14 34.5C15 44 23 50 32 49C40.5 48 46 41.5 46 33.5H32" 
        stroke="url(#gantavyaGrad)" 
